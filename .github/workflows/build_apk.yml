name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Initialize & Build APK
        run: |
          flutter create . --org com.example
          python3 -c '
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              t = p.read_text()
              t = t.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              t = t.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              t += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
              p.write_text(t)
          '
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telugu-water-reminder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
