name: telugu_water_reminder
description: Hourly Telugu voice water reminder with on-device random live video verification for you and your wife's phones.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^23.0.3
  flutter_tts: ^4.2.5
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  timezone: ^0.10.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/telugu_water_reminder.wav
